# ─────────────────────────────────────────────────────────────────────────────
# Master control panel for a single experiment batch.
# ─────────────────────────────────────────────────────────────────────────────
run_name: R15_R17_full_run
description: "Baseline HPS1 room temp full steps run for R15 and R17"
# ── Sequence selection ────────────────────────────────────────────────────────
sequences:
  source: sequences.yaml

  # Option 1 — explicit list
  select: [R15, R17]
  # Option 2 — full database
  # select: all

# ── Parameter sets ────────────────────────────────────────────────────────────
# Single value    → one run per sequence
# List of values  → cartesian product (sequence x param_set)
num_replicates: 2
param_sets: [baseline]   # Example: ["baseline", "cold"] for 2 replicates per sequence
# param_sets: [baseline, cold]   # full sweep
# ── Execution ─────────────────────────────────────────────────────────────────
runner: local                 # local | slurm
workers: 1                    # local only — parallel processes
dry_run: false                # true = print jobs without submitting